# Shared body of the gateway servers: plain HTTP (gateway.conf) and TLS
# (gateway-tls.conf, written by entrypoint.sh). Included inside each server block.

# Large file support
client_max_body_size 20G;
chunked_transfer_encoding on;
client_body_buffer_size 10M;
client_body_temp_path /tmp/nginx/client_temp 1 2;

# Timeouts
client_body_timeout 300s;
client_header_timeout 300s;
keepalive_timeout 300s;
proxy_connect_timeout 60s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

# ==========================================================================
# DNS RESOLVER CONFIGURATION - READ THIS BEFORE MODIFYING
# ==========================================================================
#
# This resolver is used by:
# 1. Lua HTTP client (resolver.lua) to query mesh-router-backend
# 2. proxy_pass when $backend contains a hostname (usually it's an IP)
#
# IMPORTANT: Do NOT add public DNS servers (8.8.8.8, 1.1.1.1) here!
#
# Why? The BACKEND_URL env var uses Docker hostnames (e.g., mesh-router-backend-inojob).
# If you add public DNS, nginx may query them in parallel with Docker DNS.
# Public DNS returns NXDOMAIN for Docker hostnames, causing intermittent 502 errors
# when the public DNS response arrives before Docker DNS.
#
# For Docker deployments: Use 127.0.0.11 (Docker's embedded DNS)
# For non-Docker deployments: Change to your system DNS and use IP/hostname in BACKEND_URL
#
# ==========================================================================
resolver 127.0.0.11 valid=30s ipv6=off;
resolver_timeout 5s;

# Variables set by Lua resolver
set $backend "";
set $proxy_host "";
set $proxy_ssl_name "";
set $mesh_route "";
set $ws_upgrade "";
set $ws_connection "";

# Health check endpoint
location = /_health {
    default_type application/json;
    return 200 '{"status":"ok"}';
}

# Handoff between gateways (docs/multi-gateway.md in mesh-router-nameserver, "Handoff"):
# set by resolver.lua, used by @mesh_handoff and gateway-proxy.conf
set $mesh_handoff_in "";     # "1": a trusted gateway handed this request over
set $mesh_handoff_peer "";   # https://<ip>:443 of the gateway that reaches the box
set $mesh_handoff_sni "";    # its certificate name, <ip-dashed>.gw.<zone>
set $mesh_handoff_mode "";   # "direct": no route of our own, hand over at once
set $mesh_handoff_out "";    # X-Mesh-Handoff towards the upstream ("1" to a gateway)

# Main routing - unified HTTP/WebSocket handling via native proxy_pass
# Flow: resolver.lua (access) sets nginx vars -> proxy_pass handles the request
location / {
    # Resolve domain to routes, sets $backend and other nginx vars
    access_by_lua_file /etc/nginx/lua/resolver.lua;

    include /etc/nginx/gateway-proxy.conf;

    # The box could not be reached (connect failed or timed out): another gateway that
    # reaches it takes the request, when there is one (handoff.lua decides)
    error_page 502 504 = @mesh_handoff;

    # Add request ID and route tracing headers
    add_header X-Request-ID $http_x_request_id always;
    add_header X-Mesh-Route $mesh_route always;

    log_by_lua_file /etc/nginx/lua/request_log.lua;
}

# Handoff: to the gateway whose tunnel provider reaches the box, verified by the mesh CA
# against <ip-dashed>.gw.<zone>. Reached from resolver.lua (no route of our own) or from
# error_page above (connect failure); handoff.lua turns the second case down when the box
# was reached (the request may have been processed) or no gateway reaches it.
location @mesh_handoff {
    access_by_lua_block {
        require("handoff").run()
    }

    include /etc/nginx/gateway-proxy.conf;

    # The other gateway's own trace follows ours
    proxy_hide_header X-Mesh-Route;
    add_header X-Request-ID $http_x_request_id always;
    add_header X-Mesh-Route $mesh_route$upstream_http_x_mesh_route always;

    log_by_lua_file /etc/nginx/lua/request_log.lua;
}
