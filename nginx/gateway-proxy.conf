# The proxy hop, shared by `location /` and `@mesh_handoff` (gateway-common.conf).
# Included inside a location: every variable is set by resolver.lua / handoff.lua.

# Disable nginx's own gzip compression - let upstream handle it
gzip off;

# Disable response buffering - critical for WebSocket and streaming
proxy_buffering off;

# Short connect timeout: a box (or the tunnel to it) that does not answer a connect in 10 s
# is down, and the handoff retry (@mesh_handoff) should not wait a minute for it.
proxy_connect_timeout 10s;

# Native nginx proxy to backend
proxy_pass $backend;
proxy_http_version 1.1;

# SSL settings for HTTPS backends
proxy_ssl_server_name on;
proxy_ssl_name $proxy_ssl_name;
proxy_ssl_verify on;
# The mesh CA only: every HTTPS upstream is a box presenting its cert0, verified against
# <label>.box.<zone>, or another gateway (handoff) verified against <ip-dashed>.gw.<zone>
# (resolver.lua, handoff.lua). A public certificate is never accepted on this hop, so an
# https DEFAULT_BACKEND must be signed by the mesh CA (or use http).
proxy_ssl_trusted_certificate /etc/ssl/certs/mesh-ca.pem;

# Proxy headers - $proxy_host preserves original Host for Caddy routing
proxy_set_header Host $proxy_host;
# The client: the address this gateway saw, or the one a trusted gateway handed over
# ($mesh_real_ip and $mesh_forwarded_for, entrypoint.sh).
proxy_set_header X-Real-IP $mesh_real_ip;
proxy_set_header X-Forwarded-For $mesh_forwarded_for;
proxy_set_header X-Forwarded-Proto $proxy_x_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;
# "1" only towards another gateway (handoff); empty = not sent, so a client's own
# X-Mesh-Handoff never reaches a box
proxy_set_header X-Mesh-Handoff $mesh_handoff_out;

# WebSocket upgrade headers - set by resolver.lua
# For WebSocket: Upgrade=websocket, Connection=upgrade
# For HTTP: both are empty (nginx passes through original values)
proxy_set_header Upgrade $ws_upgrade;
proxy_set_header Connection $ws_connection;
