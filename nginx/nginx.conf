# OpenResty Alpine uses nobody user
#user nobody;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Allow environment variables for Lua access
env SERVER_DOMAIN;
env BACKEND_URL;
env CACHE_TTL;
env DEFAULT_BACKEND;

events {
    worker_connections 4096;
}

http {
    include /usr/local/openresty/nginx/conf/mime.types;
    default_type application/octet-stream;
    types {
        application/wasm wasm;
    }

    # OpenResty temp paths
    client_body_temp_path /var/run/openresty/nginx-client-body;
    proxy_temp_path /var/run/openresty/nginx-proxy;
    fastcgi_temp_path /var/run/openresty/nginx-fastcgi;
    uwsgi_temp_path /var/run/openresty/nginx-uwsgi;
    scgi_temp_path /var/run/openresty/nginx-scgi;

    # Add custom Lua scripts to package path
    lua_package_path "/etc/nginx/lua/?.lua;;";

    # Lua HTTP client trust: public roots (https BACKEND_URL) + the mesh CA (entrypoint.sh)
    lua_ssl_trusted_certificate /etc/ssl/certs/lua-trust.pem;
    lua_ssl_verify_depth 4;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr rt=$request_time';

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # NOTE: gzip is intentionally disabled.
    # The PCS Caddy handles compression. Enabling gzip here causes issues:
    # - Lua-based proxying (content_handler.lua) passes through compressed responses
    # - nginx gzip module can interfere with already-compressed content
    # - Cloudflare also handles compression at the edge

    # Lua shared dictionaries for caching
    lua_shared_dict resolve_cache 20m;    # Domain resolution cache (+ stale copies)
    lua_shared_dict cache_locks 1m;       # Locks for cache updates
    lua_shared_dict usage_seen 10m;       # DAU notify dedup (uid|app|day)

    include /etc/nginx/conf.d/*.conf;
}

# TLS front (written by the entrypoint): SNI router that passes users' dot names and apex
# through to their box and hands everything else to the HTTP TLS server (sni_router.lua).
stream {
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_ssl_trusted_certificate /etc/ssl/certs/lua-trust.pem;  # backend lookups (sni_router.lua)
    lua_ssl_verify_depth 4;
    lua_shared_dict sni_routes 10m;    # passthrough decision per user label

    include /etc/nginx/stream.d/*.conf;
}
